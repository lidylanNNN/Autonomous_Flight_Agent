[project]
name = "autonomous-flight-agent"
version = "0.0.0"
description = "Mission-level autonomous flight agent built around ROS2, PX4, Gazebo, deterministic safety, verification, and evaluation."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.scripts]
flight-agent-trace-replay = "flight_agent.entrypoints.trace_replay_cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6.0",
    "mypy>=1.11",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["flight_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
