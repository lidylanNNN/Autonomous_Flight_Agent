[project]
name = "autonomous-flight-agent"
version = "0.0.0"
description = "Mission-level autonomous flight agent built around ROS2, PX4, Gazebo, deterministic safety, verification, and evaluation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6.0",
    "mypy>=1.11",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["flight_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
