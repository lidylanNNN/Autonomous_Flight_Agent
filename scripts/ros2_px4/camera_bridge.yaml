# Frozen default world + x500_mono_cam instance 0 only; Gazebo is the source.
- ros_topic_name: /camera/image_raw
  gz_topic_name: /world/default/model/x500_mono_cam_0/link/camera_link/sensor/imager/image
  ros_type_name: sensor_msgs/msg/Image
  gz_type_name: gz.msgs.Image
  direction: GZ_TO_ROS
  qos_profile: SENSOR_DATA
  lazy: false
- ros_topic_name: /camera/camera_info
  gz_topic_name: /world/default/model/x500_mono_cam_0/link/camera_link/sensor/imager/camera_info
  ros_type_name: sensor_msgs/msg/CameraInfo
  gz_type_name: gz.msgs.CameraInfo
  direction: GZ_TO_ROS
  qos_profile: SENSOR_DATA
  lazy: false
- ros_topic_name: /clock
  gz_topic_name: /world/default/clock
  ros_type_name: rosgraph_msgs/msg/Clock
  gz_type_name: gz.msgs.Clock
  direction: GZ_TO_ROS
  qos_profile: CLOCK
  lazy: false
